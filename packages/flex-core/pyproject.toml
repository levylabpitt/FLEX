[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flex-core"
version = "3.0.0a1"
description = "FLEX core: instrument model, protocol bases, data & metadata services, station configuration, CLI"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "platformdirs>=4",
    "tqdm>=4.66",
    "tomlkit>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "h5py>=3.10",
]

[project.optional-dependencies]
visa = ["pyvisa>=1.14"]
zmq = ["pyzmq>=25"]
serial = ["pyserial>=3.5"]
postgres = ["psycopg[binary]>=3.1"]
tdms = ["npTDMS>=1.9"]
all = ["pyvisa>=1.14", "pyzmq>=25", "pyserial>=3.5", "psycopg[binary]>=3.1", "npTDMS>=1.9"]

[project.scripts]
flex = "flex.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flex"]
